# ==============================================================================
# Use Case B2: Request insurance plan - Data Element Definition & FHIR Mapping
# Side / Role: PROVIDER
# Primary API: /v1/insuranceplan/request
# Callback API: /v1/insuranceplan/on_request
# Carries JWE: true
# Focal Resource: Task
# NRCeS Profile: https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task
# ==============================================================================

code: "B2"
title: "Request insurance plan"
side: "provider"
api: "/v1/insuranceplan/request"
callback: "/v1/insuranceplan/on_request"
workflow: "1 (hospital-level: the plan belongs to the hospital and the policy, never a case number)"
carries_jwe: true
focal_resource: "Task"
nrces_profile: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task"
profiles:
  Task: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task"
description: "Poll insurance plan package master, base tariff rates, and mandatory questionnaires keyed by policy number."
fields:
  - key: "taskCode"
    label: "Task Code"
    group: "Task"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.code.coding[0].code"
    example_value: "poll"
  - key: "policyNumber"
    label: "Policy Number"
    group: "Task Input"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.input[type=policyNumber].valueString"
    example_value: "POL7UMU001"
  - key: "facilityId"
    label: "Provider HFR ID"
    group: "Task Input"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.input[type=providerId].valueString"
    example_value: "IN1910000151"
