code: "A1"
title: "Get participant list"
side: "shared"
api: "/fetch/participants/list"
callback: null
workflow: "none"
carries_jwe: false
focal_resource: "Participant Registry List (JSON)"
profiles:
  Organization: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Organization"
description: "Retrieve list of active participants (payers, providers, TPAs) registered on the network filtered by role."
fields:
  - key: "role"
    label: "Role Filter (PAYER, PROVIDER or TPA)"
    group: "Request"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.role"
    example_value: "PAYER"
  - key: "fromDate"
    label: "Registered From (dd/MM/yyyy)"
    group: "Request"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.fromdate"
    example_value: "01/04/2021"
  - key: "toDate"
    label: "Registered To (dd/MM/yyyy)"
    group: "Request"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.todate"
    example_value: "20/03/2026"
  - key: "entityType"
    label: "Entity Type"
    group: "Request"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.entitytype"
    example_value: "Gov"
  - key: "participantCode"
    label: "Participant ID (@hcx)"
    group: "Response"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON response)"
    fhir_path: "Response.participantdetails[].participantcode"
    example_value: "1000003538@hcx"
  - key: "participantName"
    label: "Entity Name"
    group: "Response"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON response)"
    fhir_path: "Response.participantdetails[].participantname"
    example_value: "NHCX Dummy Payer"
