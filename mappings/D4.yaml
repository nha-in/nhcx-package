# ==============================================================================
# Use Case D4: Submit pre-authorisation - Data Element Definition & FHIR Mapping
# Side / Role: PROVIDER
# Primary API: /v1/preauth/submit
# Callback API: /v1/preauth/on_submit
# Carries JWE: true
# Focal Resource: Claim
# NRCeS Profile: https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim
# ==============================================================================

code: "D4"
title: "Submit pre-authorisation"
side: "provider"
api: "/v1/preauth/submit"
callback: "/v1/preauth/on_submit"
workflow: "12 (Preauth requested)"
carries_jwe: true
focal_resource: "Claim"
nrces_profile: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim"
profiles:
  Claim: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim"
  Patient: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Patient"
  Organization: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Organization"
  Practitioner: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Practitioner"
description: "Submit PMJAY pre-authorisation with mandatory photo of patient, clinical questionnaire, and package selection."
fields:
  - key: "claimNumber"
    label: "PMJAY Case Number"
    group: "Case"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim"
    fhir_path: "Claim.identifier[0].value"
    example_value: "VB26AA2600001"
  - key: "patientName"
    label: "Patient Full Name"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.name[0].text"
    example_value: "Ramesh Chandra Sharma"
  - key: "memberId"
    label: "Scheme / Insurer Member ID"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.identifier[type=PMJAY].value"
    also_at:
      - "Coverage.subscriberId"
    example_value: "PMJAY-HP-2024-998811"
  - key: "abhaNumber"
    label: "ABHA Number"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "Patient"
    fhir_path: "Patient.identifier[type=ABHA].value"
    example_value: "91234567890123"
  - key: "gender"
    label: "Gender"
    group: "Beneficiary"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.gender"
    code_system: "http://hl7.org/fhir/administrative-gender"
    example_value: "male"
  - key: "birthDate"
    label: "Date of Birth"
    group: "Beneficiary"
    data_type: "date"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.birthDate"
    example_value: "1982-06-15"
  - key: "patientPhone"
    label: "Mobile Phone"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "Patient"
    fhir_path: "Patient.telecom[system=phone].value"
    example_value: "9876543210"
  - key: "facilityId"
    label: "Hospital Facility ID (HFR/NPI)"
    group: "Provider"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=prov].identifier[system=https://facility.abdm.gov.in].value"
    example_value: "IN1910000151"
  - key: "providerName"
    label: "Hospital Name"
    group: "Provider"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=prov].name"
    example_value: "Apex Multispeciality Hospital"
  - key: "payerId"
    label: "Payer Identifier (NIIP)"
    group: "Payer"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=pay].identifier[system=https://irdai.gov.in].value"
    example_value: "1000003538"
  - key: "payerName"
    label: "Payer Name"
    group: "Payer"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=pay].name"
    example_value: "National Health Authority - PMJAY"
  - key: "practitionerId"
    label: "Practitioner ID (HPID/HPIN)"
    group: "Practitioner"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Practitioner"
    fhir_path: "Practitioner.identifier[system=https://hpr.abdm.gov.in].value"
    example_value: "21-8899-4455-6677"
  - key: "practitionerName"
    label: "Doctor Name"
    group: "Practitioner"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Practitioner"
    fhir_path: "Practitioner.name[0].text"
    example_value: "Dr. Arvind Kumar"
  - key: "primaryDiagnosisCode"
    label: "Primary Diagnosis (ICD-10)"
    group: "Clinical"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim.diagnosis"
    fhir_path: "Claim.diagnosis[0].diagnosisCodeableConcept.coding[0].code"
    code_system: "http://hl7.org/fhir/sid/icd-10"
    example_value: "A97.0"
  - key: "procedureCode"
    label: "Package / Procedure Code"
    group: "Clinical"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim.procedure"
    fhir_path: "Claim.procedure[0].procedureCodeableConcept.coding[0].code"
    example_value: "MG004A"
  - key: "patientPhoto"
    label: "Patient Photo on Bed (POI)"
    group: "Documents"
    data_type: "base64Binary"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim.supportingInfo[category=POI]"
    fhir_path: "Claim.supportingInfo[category=POI].valueAttachment.data"
    example_value: "JVBERi0xLjQK..."
