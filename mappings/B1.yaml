# ==============================================================================
# Use Case B1: Check coverage eligibility - Data Element Definition & FHIR Mapping
# Side / Role: PROVIDER
# Primary API: /v1/coverageeligibility/check
# Callback API: /v1/coverageeligibility/on_check
# Carries JWE: true
# Focal Resource: CoverageEligibilityRequest
# NRCeS Profile: https://nrces.in/ndhm/fhir/r4/StructureDefinition/CoverageEligibilityRequest
# ==============================================================================

code: "B1"
title: "Check coverage eligibility"
side: "provider"
api: "/v1/coverageeligibility/check"
callback: "/v1/coverageeligibility/on_check"
workflow: "none (sits beside 10, 11)"
carries_jwe: true
focal_resource: "CoverageEligibilityRequest"
nrces_profile: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/CoverageEligibilityRequest"
profiles:
  CoverageEligibilityRequest: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/CoverageEligibilityRequest"
  Patient: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Patient"
  Coverage: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Coverage"
  Organization: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Organization"
description: "Inquire whether beneficiary policy is in force, wallet balance, sub-limits, or mandatory preauth document rules."
fields:
  - key: "purpose"
    label: "Eligibility Purpose"
    group: "Case"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "CoverageEligibilityRequest"
    fhir_path: "CoverageEligibilityRequest.purpose[0]"
    code_system: "http://hl7.org/fhir/eligibilityrequest-purpose"
    example_value: "auth-requirements"
  - key: "caseNumber"
    label: "Provider Reference"
    group: "Case"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "CoverageEligibilityRequest"
    fhir_path: "CoverageEligibilityRequest.identifier[0].value"
    also_at:
      - "Bundle.id"
    example_value: "PA0000000001"
  - key: "servicedDate"
    label: "Date of Service"
    group: "Case"
    data_type: "date"
    cardinality: "1..1"
    required: true
    fhir_resource: "CoverageEligibilityRequest"
    fhir_path: "CoverageEligibilityRequest.servicedDate"
    example_value: "2026-02-26"
  - key: "patientName"
    label: "Patient Full Name"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.name[0].text"
    example_value: "Ramesh Chandra Sharma"
  - key: "memberId"
    label: "Scheme / Insurer Member ID"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.identifier[type=PMJAY].value"
    also_at:
      - "Coverage.subscriberId"
    example_value: "PMJAY-HP-2024-998811"
  - key: "abhaNumber"
    label: "ABHA Number"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "Patient"
    fhir_path: "Patient.identifier[type=ABHA].value"
    example_value: "91234567890123"
  - key: "gender"
    label: "Gender"
    group: "Beneficiary"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.gender"
    code_system: "http://hl7.org/fhir/administrative-gender"
    example_value: "male"
  - key: "birthDate"
    label: "Date of Birth"
    group: "Beneficiary"
    data_type: "date"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.birthDate"
    example_value: "1982-06-15"
  - key: "patientPhone"
    label: "Mobile Phone"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "Patient"
    fhir_path: "Patient.telecom[system=phone].value"
    example_value: "9876543210"
  - key: "policyNumber"
    label: "Policy Number"
    group: "Coverage"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Coverage"
    fhir_path: "Coverage.identifier[0].value"
    example_value: "PMJAY/HP/S/G"
  - key: "facilityId"
    label: "Hospital Facility ID (HFR/NPI)"
    group: "Provider"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=prov].identifier[system=https://facility.abdm.gov.in].value"
    example_value: "IN1910000151"
  - key: "providerName"
    label: "Hospital Name"
    group: "Provider"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=prov].name"
    example_value: "Apex Multispeciality Hospital"
  - key: "payerId"
    label: "Payer Identifier (NIIP)"
    group: "Payer"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=pay].identifier[system=https://irdai.gov.in].value"
    example_value: "1000003538"
  - key: "payerName"
    label: "Payer Name"
    group: "Payer"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=pay].name"
    example_value: "National Health Authority - PMJAY"
  - key: "productOrService"
    label: "Package Code"
    group: "Item"
    data_type: "string"
    cardinality: "0..*"
    required: false
    fhir_resource: "CoverageEligibilityRequest.item"
    fhir_path: "CoverageEligibilityRequest.item[].productOrService.coding[0].code"
    example_value: "MG004A"
