# ==============================================================================
# Use Case D7: Answer a pre-authorisation query - Data Element Definition & FHIR Mapping
# Side / Role: PMJAY
# Primary API: /v1/preauth/submit
# Callback API: /v1/preauth/on_submit
# Carries JWE: true
# Focal Resource: Claim
# NRCeS Profile: https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim
# ==============================================================================

code: "D7"
title: "Answer a pre-authorisation query"
side: "pmjay"
api: "/v1/preauth/submit"
callback: "/v1/preauth/on_submit"
workflow: "19 (Query answered under PMJAY)"
carries_jwe: true
focal_resource: "Claim"
nrces_profile: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim"
profiles:
  Claim: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim"
description: "Answer PMJAY medical desk query directly on preauth endpoint carrying CQD clinical note responses."
fields:
  - key: "claimNumber"
    label: "Case Number"
    group: "Case"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim"
    fhir_path: "Claim.identifier[0].value"
    example_value: "NM-26-0SE00002N"
  - key: "workflowId"
    label: "Workflow Code"
    group: "Header"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Header"
    fhir_path: "Header.x-hcx-workflow_id"
    example_value: "19"
  - key: "queryAnswerText"
    label: "Query Answer (NMI)"
    group: "Documents"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim.supportingInfo[category=NMI]"
    fhir_path: "Claim.supportingInfo[category=NMI].valueString"
    example_value: "Pre-operative investigation reports attached: CBC, RFT, chest X-ray and ECG."
