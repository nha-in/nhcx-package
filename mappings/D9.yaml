# ==============================================================================
# Use Case D9: Submit claim - Data Element Definition & FHIR Mapping
# Side / Role: PMJAY
# Primary API: /v1/claim/submit
# Callback API: /v1/claim/on_submit
# Carries JWE: true
# Focal Resource: Claim
# NRCeS Profile: https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim
# ==============================================================================

code: "D9"
title: "Submit claim"
side: "pmjay"
api: "/v1/claim/submit"
callback: "/v1/claim/on_submit"
workflow: "15 (Claim submitted)"
carries_jwe: true
focal_resource: "Claim"
nrces_profile: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim"
profiles:
  Claim: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim"
  Patient: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Patient"
  Organization: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Organization"
  Practitioner: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Practitioner"
description: "Submit PMJAY final discharge claim with discharge summary, final billing package, and patient exit photos."
fields:
  - key: "claimNumber"
    label: "PMJAY Claim Number"
    group: "Case"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim"
    fhir_path: "Claim.identifier[0].value"
    example_value: "NM-26-0SF000030"
  - key: "dischargeSummary"
    label: "Hospital Discharge Summary (HDS)"
    group: "Documents"
    data_type: "base64Binary"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim.supportingInfo[category=HDS]"
    fhir_path: "Claim.supportingInfo[category=HDS].valueAttachment.data"
    example_value: "JVBERi0xLjQK..."
  - key: "patientName"
    label: "Patient Full Name"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.name[0].text"
    example_value: "E2E Nano VZ4Q2"
  - key: "memberId"
    label: "Scheme / Insurer Member ID"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.identifier[type=PMJAY].value"
    also_at:
      - "Coverage.subscriberId"
    example_value: "PMJAY0000X"
  - key: "abhaNumber"
    label: "ABHA Number"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "Patient"
    fhir_path: "Patient.identifier[type=ABHA].value"
    example_value: "91-0000-0000-0000"
  - key: "gender"
    label: "Gender"
    group: "Beneficiary"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.gender"
    code_system: "http://hl7.org/fhir/administrative-gender"
    example_value: "male"
  - key: "birthDate"
    label: "Date of Birth"
    group: "Beneficiary"
    data_type: "date"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.birthDate"
    example_value: "2002-01-01"
  - key: "patientPhone"
    label: "Mobile Phone"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "Patient"
    fhir_path: "Patient.telecom[system=phone].value"
    example_value: "9876543210"
  - key: "facilityId"
    label: "Hospital Facility ID (HFR/NPI)"
    group: "Provider"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=prov].identifier[type=NPI].value"
    example_value: "IN1910000151"
  - key: "providerName"
    label: "Hospital Name"
    group: "Provider"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=prov].name"
    example_value: "KyroCare Multispeciality Hospital"
  - key: "payerId"
    label: "Payer Identifier (NIIP)"
    group: "Payer"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=pay].identifier[type=NIIP].value"
    example_value: "1518"
  - key: "payerName"
    label: "Payer Name"
    group: "Payer"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=pay].name"
    example_value: "PMJAY / Ayushman Bharat"
  - key: "practitionerId"
    label: "Practitioner ID (HPID/HPIN)"
    group: "Practitioner"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Practitioner"
    fhir_path: "Practitioner.identifier[system=https://hpr.abdm.gov.in].value"
    example_value: "71-8422-5818-7201"
  - key: "practitionerName"
    label: "Doctor Name"
    group: "Practitioner"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Practitioner"
    fhir_path: "Practitioner.name[0].text"
    example_value: "Dr. Ananya Rao"
