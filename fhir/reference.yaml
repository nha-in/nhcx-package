  system_defects:
    - [
        Package codes,
        "The same code appears under a payer host, under SNOMED and under two
          ValueSet URLs, depending on the exchange. None is a SNOMED concept"
      ]
    - [
        Supporting-info category,
        "Document entries bind `category` to the supporting-info code system
          rather than the category system; the plan does the reverse"
      ]
    - [ Claim.type, "Binds to a ValueSet URL where a CodeSystem URL belongs" ]
    - [
        Adjudication categories,
        "Some senders bind them to an HTML documentation page,
          `https://hl7.org/fhir/R4/valueset-adjudication.html`"
      ]
    - [
        Plan cost types,
        "Bind to the plan-type system under a `www.` host, with values that
          are not plan types"
      ]
    - [
        Missing systems,
        "`deductible`, the claim-level status and some package codings carry
          no `system` at all"
      ]
# Text from one participant's test traffic. Removed, or replaced where a
# replacement is given, wherever a bundle value is shown in a chapter.
redact:
  - \s*(?:on|before|at) (?:the |an )?(?:nanoemr )?(?:e2e|end-to-end) run
  - pattern: 'E2E Nano \w+'
    replace: '<patient name>'
# Profiles the bundles declare that NRCeS does not publish. The chapters name
# them and link the base FHIR definition instead.
nrces_unpublished: [ QuestionnaireResponse ]
