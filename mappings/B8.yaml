# ==============================================================================
# Use Case B8: Reprocess or cancel - Data Element Definition & FHIR Mapping
# Side / Role: PROVIDER
# Primary API: /v1/task/submit
# Callback API: /v1/task/on_submit
# Carries JWE: true
# Focal Resource: Task
# NRCeS Profile: https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task
# ==============================================================================

code: "B8"
title: "Reprocess or cancel"
side: "provider"
api: "/v1/task/submit"
callback: "/v1/task/on_submit"
workflow: "PC01 (Cancel), 36 (Reprocess of a rejected claim, or Release), 1 (Status enquiry)"
carries_jwe: true
focal_resource: "Task"
nrces_profile: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task"
profiles:
  Task: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task"
description: "Submit request to cancel a pre-authorisation (until its claim is decided), appeal a rejected claim (reason claimrejected or rejectiondisputed), release the balance of a short-paid claim, or ask where a case stands."
fields:
  - key: "taskCode"
    label: "Action Code"
    group: "Task"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.code.coding[0].code"
    example_value: "reprocess"
  - key: "taskReason"
    label: "Appeal Reason Code"
    group: "Task"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.reasonCode.coding[0].code"
    example_value: "claimrejected"
  - key: "originalCaseNumber"
    label: "Original Case Number"
    group: "Task Input"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.input[type=claimNumber].valueString"
    example_value: "NM-26-0SE00002L"
  - key: "appealDocument"
    label: "Supporting Document (mandatory on a reprocess)"
    group: "Task Input"
    data_type: "base64Binary"
    cardinality: "0..1"
    required: false
    fhir_resource: "Task"
    fhir_path: "Task.input[type=document].valueAttachment.data"
    example_value: "JVBERi0xLjQK..."
