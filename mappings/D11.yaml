# ==============================================================================
# Use Case D11: Reprocess a rejected claim - Data Element Definition & FHIR Mapping
# Side / Role: PMJAY
# Primary API: /v1/task/submit
# Callback API: /v1/task/on_submit
# Carries JWE: true
# Focal Resource: Task
