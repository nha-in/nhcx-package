# Where the PMJAY handbook and the status sheet disagree. Prefer the sheet.
disagreements:
  - code: '17'
    handbook: PAYMENT_RECEIVED, provider-side - "Payment received acknowledgment"
    sheet: '"Payment Notice Recived", response.complete'
  - code: '24'
    handbook: Payer-side response code, PREAUTH_REQUEST_QUERIED
    sheet: '"PreAuth Request Queried", header request.initiated'
  - code: '27'
    handbook: Payer-side response code, CLAIM_REQUEST_QUERIED
    sheet: '"Claim Request Queried", header request.initiated'
  - code: '30'
    handbook: Payer-side, PAYMENT_INITIATED
    sheet: '"Payment Notice Initmation", request.initiated'
  - code: 31 / 33
    handbook: Payer-side response codes
    sheet: header request.initiated
  - code: '251'
    handbook: REPROCESS_REQUEST_RECEIVED
    sheet: '"PreAuth Reprocess Ack"'
  - code: '36'
    handbook: CLAIM_ARBITRATION_REQUEST_SUBMITTED, use case "Reprocess/Erroneous request"
    sheet: '"Claim Arbitration Intimation"'
