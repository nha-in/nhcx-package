# ==============================================================================
# Use Case C1: Link ABHA with policy - Data Element Definition & FHIR Mapping
# Side / Role: PAYER
# Primary API: /participant/link/abha/policy
# Callback API: None
# Carries JWE: false
# Focal Resource: Policy Link Record (JSON)
# NRCeS Profile: none, not a FHIR resource
# ==============================================================================

code: "C1"
title: "Link ABHA with policy"
side: "payer"
api: "/participant/link/abha/policy"
callback: null
workflow: "none"
carries_jwe: false
focal_resource: "Policy Link Record (JSON)"
profiles: {}
description: "Bind beneficiary ABHA number and mobile to policy records in the registry upon policy issuance."
fields:
  - key: "requestId"
    label: "Request ID (UUID)"
    group: "Request"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.requestid"
    example_value: "7f3f2a4e-0c6b-4b7a-9e2d-2c1f8a5b6d90"
  - key: "abhaNumber"
    label: "ABHA Number"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.abhanumber"
    example_value: "12345678910111"
  - key: "mobileNumber"
    label: "Mobile Number"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.mobilenumber"
    example_value: "9876543210"
  - key: "memberId"
    label: "Member ID"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.memberid"
    example_value: "MEM-2026-000123"
  - key: "payerId"
    label: "Insurer Participant Code"
    group: "Payer"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.payerid"
    example_value: "100234@sbx"
  - key: "processingId"
    label: "Claim Processor Participant Code"
    group: "Payer"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.processingid"
    example_value: "100235@sbx"
  - key: "productId"
    label: "Policy Product ID"
    group: "Policy"
    data_type: "string"
    cardinality: "1..*"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.policies[].productid"
    example_value: "PRD-FLOATER-01"
  - key: "productName"
    label: "Policy Product Name"
    group: "Policy"
    data_type: "string"
    cardinality: "1..*"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.policies[].productname"
    example_value: "Family Floater Gold"
