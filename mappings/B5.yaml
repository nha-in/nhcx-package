# ==============================================================================
# Use Case B5: Submit claim - Data Element Definition & FHIR Mapping
# Side / Role: PROVIDER
# Primary API: /v1/claim/submit
# Callback API: /v1/claim/on_submit
# Carries JWE: true
# Focal Resource: Claim
# NRCeS Profile: https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim
# ==============================================================================

code: "B5"
title: "Submit claim"
side: "provider"
api: "/v1/claim/submit"
callback: "/v1/claim/on_submit"
workflow: "15 (Claim), 151 (Query answer), 14 (Provisional discharge)"
carries_jwe: true
focal_resource: "Claim"
nrces_profile: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim"
profiles:
  Claim: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Claim"
  Patient: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Patient"
  Coverage: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Coverage"
  Organization: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Organization"
  Practitioner: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Practitioner"
description: "Submit final itemized discharge bills, discharge summary, and pharmacy charges for claims adjudication."
fields:
  - key: "claimNumber"
    label: "Final Claim Number"
    group: "Case"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim"
    fhir_path: "Claim.identifier[0].value"
    also_at:
      - "Bundle.id"
    example_value: "NM-26-0SE00002L"
  - key: "use"
    label: "Claim Use"
    group: "Case"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim"
    fhir_path: "Claim.use"
    example_value: "claim"
  - key: "preAuthRef"
    label: "Approved Pre-auth Reference"
    group: "Case"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim"
    fhir_path: "Claim.insurance[0].preAuthRef[0]"
    example_value: "CL/26/0SE000107"
  - key: "patientName"
    label: "Patient Full Name"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.name[0].text"
    example_value: "E2E Nano UV0I4"
  - key: "memberId"
    label: "Scheme / Insurer Member ID"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.identifier[type=PMJAY].value"
    also_at:
      - "Coverage.subscriberId"
    example_value: "MRAV1985001"
  - key: "abhaNumber"
    label: "ABHA Number"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "Patient"
    fhir_path: "Patient.identifier[type=ABHA].value"
    example_value: "91-1234-1234-1234"
  - key: "gender"
    label: "Gender"
    group: "Beneficiary"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.gender"
    code_system: "http://hl7.org/fhir/administrative-gender"
    example_value: "male"
  - key: "birthDate"
    label: "Date of Birth"
    group: "Beneficiary"
    data_type: "date"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.birthDate"
    example_value: "1985-06-15"
  - key: "patientPhone"
    label: "Mobile Phone"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "Patient"
    fhir_path: "Patient.telecom[system=phone].value"
    example_value: "9876543210"
  - key: "policyNumber"
    label: "Policy Number"
    group: "Coverage"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Coverage"
    fhir_path: "Coverage.identifier[0].value"
    example_value: "POL7UMU001"
  - key: "facilityId"
    label: "Hospital Facility ID (HFR/NPI)"
    group: "Provider"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=prov].identifier[type=NPI].value"
    example_value: "IN1910000151"
  - key: "providerName"
    label: "Hospital Name"
    group: "Provider"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=prov].name"
    example_value: "KyroCare Multispeciality Hospital"
  - key: "payerId"
    label: "Payer Identifier (NIIP)"
    group: "Payer"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=pay].identifier[type=NIIP].value"
    example_value: "1000004805"
  - key: "payerName"
    label: "Payer Name"
    group: "Payer"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Organization"
    fhir_path: "Organization[type=pay].name"
    example_value: "Sandbox Payer"
  - key: "practitionerId"
    label: "Practitioner ID (HPID/HPIN)"
    group: "Practitioner"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Practitioner"
    fhir_path: "Practitioner.identifier[system=https://hpr.abdm.gov.in].value"
    example_value: "71-8422-5818-7201"
  - key: "practitionerName"
    label: "Doctor Name"
    group: "Practitioner"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Practitioner"
    fhir_path: "Practitioner.name[0].text"
    example_value: "Dr. Ananya Rao"
  - key: "admissionDate"
    label: "Admission Date"
    group: "Stay"
    data_type: "dateTime"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim"
    fhir_path: "Claim.billablePeriod.start"
    example_value: "2026-09-10T00:00:00+05:30"
  - key: "dischargeDate"
    label: "Discharge Date"
    group: "Stay"
    data_type: "dateTime"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim"
    fhir_path: "Claim.billablePeriod.end"
    example_value: "2026-09-10T00:00:00+05:30"
  - key: "careSetting"
    label: "Claim Type (care setting)"
    group: "Stay"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim"
    fhir_path: "Claim.type.coding[0].code"
    code_system: "http://snomed.info/sct"
    example_value: "737481003"
  - key: "primaryDiagnosisCode"
    label: "Primary Diagnosis (ICD-10)"
    group: "Clinical"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim.diagnosis"
    fhir_path: "Claim.diagnosis[0].diagnosisCodeableConcept.coding[0].code"
    code_system: "http://hl7.org/fhir/sid/icd-10"
    example_value: "E11.9"
  - key: "procedureCode"
    label: "Package / Procedure Code"
    group: "Clinical"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim.item"
    fhir_path: "Claim.item[0].productOrService.coding[0].code"
    code_system: "https://nrces.in/ndhm/fhir/r4/CodeSystem/ndhm-procedure-code"
    example_value: "PROC-KNEE-01"
  - key: "finalBilledAmount"
    label: "Total Claim Amount"
    group: "Billing"
    data_type: "decimal"
    cardinality: "1..1"
    required: true
    fhir_resource: "Claim"
    fhir_path: "Claim.total.value"
    example_value: "150000"
