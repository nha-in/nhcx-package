# Every workflow ID NHA publishes, from both sources that publish them.
#
# The PMJAY handbook splits the cashless mainline by who authors the message.
# NHA's Workflow Status Sheet is wider and also names the x-hcx-status each
# stage travels with. Where they disagree, prefer the sheet.
#
# A code is not a message on its own: several are reused across the
# initiation, the acknowledgement and the error path, and only the pair with
# x-hcx-status tells them apart. Those carry reused: true and list every
# status they appear under.
#
# Spellings are as published, typos included, so a value seen in a payload
# can be searched for.
#
# sheet is NHA's Workflow Status Sheet row by row, in its order: a reused
# code has one row per x-hcx-status, which the per-code lists cannot pair up.
# disagreements lists where the handbook and the sheet differ.
#
# This file is the maintained source, edited here. build-docs renders it into
# docs/01-Overview/06-Workflow Codes.md, and the devtools console reads it from the package release.

counts:
  codes: 74
  sheet_rows: 86
  reused: 8
  disagreements: 7
families:
  - prefix: R
    name: Reimbursement
    covers: Mirrors the numeric cashless codes for the reimbursement route - the patient paid, and is claiming it back.
  - prefix: G
    name: Grievance
    covers: Raising a grievance, its acknowledgement, and its failure path.
  - prefix: RP
    name: Return payment
    covers: Money going back the other way.
  - prefix: N
    name: Notifications
    covers: Push notifications addressed to payer, provider or beneficiary.
  - prefix: DC
    name: Discharge correction
    covers: Correcting a discharge already submitted.
  - prefix: PC
    name: Preauth cancellation
    covers: 'Withdrawing a pre-authorisation. Raised on /v1/task/submit with code `cancel`, not on the preauth endpoint.'
