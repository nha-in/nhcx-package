code: "C2"
title: "De-link ABHA from policy"
side: "payer"
api: "/participant/delink/abha/policy"
callback: null
workflow: "none"
carries_jwe: false
focal_resource: "Policy Delink Record (JSON)"
profiles: {}
description: "Remove the link between a member and a policy product upon cancellation or transfer. The request names the member ID and the products, not the ABHA number; only the payer or processor named on the link may remove it."
fields:
  - key: "requestId"
    label: "Request ID (UUID)"
    group: "Request"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.requestid"
    example_value: "9a7c5e3d-1b2f-4c8a-b6d4-0e9f8a7b6c55"
  - key: "memberId"
    label: "Member ID"
    group: "Beneficiary"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.memberid"
    example_value: "MEM-2026-000123"
  - key: "payerId"
    label: "Insurer Participant Code"
    group: "Payer"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.payerid"
    example_value: "100234@sbx"
  - key: "processingId"
    label: "Claim Processor Participant Code"
    group: "Payer"
    data_type: "string"
    cardinality: "0..1"
    required: false
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.processingid"
    example_value: "100235@sbx"
  - key: "productId"
    label: "Policy Product ID"
    group: "Policy"
    data_type: "string"
    cardinality: "1..*"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.policies[].productid"
    example_value: "PRD-FLOATER-01"
