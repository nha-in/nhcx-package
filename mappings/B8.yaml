# ==============================================================================
# Use Case B8: Reprocess or cancel - Data Element Definition & FHIR Mapping
# Side / Role: PROVIDER
# Primary API: /v1/task/submit
# Callback API: /v1/task/on_submit
# Carries JWE: true
# Focal Resource: Task
# NRCeS Profile: https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task
# ==============================================================================

code: "B8"
title: "Reprocess or cancel"
side: "provider"
api: "/v1/task/submit"
callback: "/v1/task/on_submit"
workflow: "PC01 (Cancel), 36 (Reprocess / Dispute)"
carries_jwe: true
focal_resource: "Task"
nrces_profile: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task"
profiles:
  Task: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task"
description: "Submit request to cancel an approved pre-authorisation or appeal a rejected claim."
fields:
  - key: "taskCode"
    label: "Action Code"
    group: "Task"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.code.coding[0].code"
    example_value: "reprocess"
  - key: "taskReason"
    label: "Appeal Reason Code"
    group: "Task"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.reasonCode.coding[0].code"
    example_value: "claimrejected"
  - key: "originalCaseNumber"
    label: "Original Case Number"
    group: "Task Input"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.input[0].valueString"
    example_value: "CL0000000001"
  - key: "appealDocument"
    label: "Dispute Justification Document"
    group: "Task Input"
    data_type: "base64Binary"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.input[category=document].valueAttachment.data"
    example_value: "JVBERi0xLjQK..."
