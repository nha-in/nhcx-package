# NHCX error codes: the gateway codes, the standard payer codes and the reference payer codes.
# build-docs renders the tables in docs/06-Reference/01-Error Codes.md from this file.
# kind is the published sheet's classification, Transport or Business, on the codes the sheet classifies.
# collisions lists the codes from PAYR-1001 to PAYR-1020 that the standard sheet (Payer Error Codes) and the
# reference payer's Bridge Error sheet read differently: eighteen of the twenty. PAYR-1001 and PAYR-1002 are
# a decryption and an encryption failure on both sheets.
# note, on a code, records what the SHA HP sandbox payer sent that the sheet does not say. The observed space
# holds the one code the sandbox run met that is on none of the seven sheets.
spaces:
  - id: gateway
    name: Gateway
    prefix: NHCX-
    sent_by: The exchange
    arrives: Synchronously on your own call, or on /v1/error
  - id: standard-payer
    name: Standard payer
    prefix: PAYR-1001 to PAYR-1020
    sent_by: A payer implementing the published standard
    arrives: Inside the sealed response
  - id: reference-payer
    name: Reference payer
    prefix: PAYR-1001 to PAYR-1520
    sent_by: The PMJAY reference implementation
    arrives: Inside the sealed response
  - id: observed
    name: Observed live
    prefix: ERR-PYR-
    sent_by: The PMJAY reference implementation, on none of its published sheets
    arrives: Inside the sealed response
collisions:
  - code: PAYR-1003
    standard_payer: Error while connecting to NHCX; the system will resend later
    reference_payer: Invalid workflow requested (marked deprecated on the Bridge Error sheet)
  - code: PAYR-1004
    standard_payer: Provider is not registered with the payer for the requested policy
    reference_payer: Received FHIR bundle is malformed
  - code: PAYR-1005
    standard_payer: Beneficiary is not a covered member for the requested policy
    reference_payer: Maximum time limit exceeded in receiving the request
  - code: PAYR-1006
    standard_payer: Policy does not exist
    reference_payer: Invalid name in request (marked deprecated on the Bridge Error sheet)
  - code: PAYR-1007
    standard_payer: Requested policy is expired
    reference_payer: Invalid gender in request (marked deprecated on the Bridge Error sheet)
  - code: PAYR-1008
    standard_payer: Eligible coverage amount is insufficient
    reference_payer: Invalid FHIR bundle received
  - code: PAYR-1009
    standard_payer: Requested items are not valid or not covered
    reference_payer: No identifier found for patient component
  - code: PAYR-1010
    standard_payer: Preauthorisation is required but was not obtained
    reference_payer: No type found for patient component identifier
  - code: PAYR-1011
    standard_payer: The prior approved package does not support enhancement
    reference_payer: No identifier found for claim component
  - code: PAYR-1012
    standard_payer: Claim amount is more than the preauthorisation approved amount
    reference_payer: No type found for claim component identifier
  - code: PAYR-1013
    standard_payer: No prior approval for the requested procedures or packages
    reference_payer: No identifier found for organization component for provider
  - code: PAYR-1014
    standard_payer: Date of birth is after the date of service
    reference_payer: No type found for organization component identifier for provider
  - code: PAYR-1015
    standard_payer: Date of service is after the date of death
    reference_payer: No identifier found for organization component for payer
  - code: PAYR-1016
    standard_payer: Duplicate claim submitted based on service codes and dates
    reference_payer: No type found for organization component identifier for payer
  - code: PAYR-1017
    standard_payer: Amount calculations are not correct
    reference_payer: No task code received
  - code: PAYR-1018
    standard_payer: Time limit for submission expired
    reference_payer: No task reason code received
  - code: PAYR-1019
    standard_payer: Requested additional information was not received in time
    reference_payer: Invalid sequence received in supporting info element
  - code: PAYR-1020
    standard_payer: No valid bank details found for the provider
    reference_payer: Invalid category received in supporting info element
bands:
  - band: NHCX-1xxx
    rejected_by: The exchange, on the envelope
    means: The message never reached the payer
  - band: PAYR-10xx
    rejected_by: Transport and bundle structure
    means: An element, id, sequence or type is missing. Not a value problem
  - band: PAYR-11xx
    rejected_by: Coverage eligibility
    means: The policy, the beneficiary or the hospital configuration
  - band: PAYR-12xx
    rejected_by: Preauthorisation
    means: Codes, amounts, dates, sequencing and scheme rules
  - band: PAYR-13xx
    rejected_by: Claim
    means: The same, against the approved preauthorisation
  - band: PAYR-14xx
    rejected_by: Insurance plan, and the scheme's outer rules
    means: Empanelment, policy association, plan configuration
