# ==============================================================================

code: "D11"
title: "Reprocess a rejected claim"
side: "pmjay"
api: "/v1/task/submit"
callback: "/v1/task/on_submit"
workflow: "36 (Claim arbitration requested)"
carries_jwe: true
focal_resource: "Task"
nrces_profile: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task"
profiles:
  Task: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task"
description: "Submit grievance / arbitration appeal to State Health Agency for an improperly rejected claim. Only a rejected claim is reprocessed; reason claimrejected or rejectiondisputed."
fields:
  - key: "taskCode"
    label: "Task Code"
    group: "Task"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.code.coding[0].code"
    example_value: "reprocess"
  - key: "taskReason"
    label: "Dispute Reason"
    group: "Task"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.reasonCode.coding[0].code"
    example_value: "claimrejected"
  - key: "claimNumber"
    label: "Rejected Claim ID"
    group: "Task Input"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Task"
    fhir_path: "Task.input[type=claimNumber].valueString"
    example_value: "NM-26-0SF00002U"
