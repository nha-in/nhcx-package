# ==============================================================================
# Use Case D2: Authenticate the beneficiary - Data Element Definition & FHIR Mapping
# Side / Role: PMJAY
# Primary API: ABHA biometric auth init and verify (not NHCX)
# Callback API: None
# Carries JWE: false
# Focal Resource: ABHA Auth Token
# NRCeS Profile: none, not a FHIR resource
# ==============================================================================

code: "D2"
title: "Authenticate the beneficiary"
side: "pmjay"
api: "ABHA biometric auth init and verify (not NHCX)"
callback: null
workflow: "none"
carries_jwe: false
focal_resource: "ABHA Auth Token"
profiles:
  Patient: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Patient"
description: "Biometric or OTP authentication of beneficiary against ABDM registry prior to PMJAY admission."
fields:
  - key: "abhaNumber"
    label: "ABHA Number"
    group: "Request"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.loginId"
    example_value: "91-XXXX-XXXX-1234"
  - key: "authMode"
    label: "Authentication Mode (FINGERPRINT, IRIS or FACE)"
    group: "Request"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON body)"
    fhir_path: "Request.authMode"
    example_value: "FINGERPRINT"
  - key: "authToken"
    label: "Beneficiary User Token (valid 1800 seconds)"
    group: "Response"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JSON response)"
    fhir_path: "Response.token"
    example_value: "eyZhx..."
