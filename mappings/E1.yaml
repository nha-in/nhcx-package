# ==============================================================================
# Use Case E1: Subscribe to notifications - Data Element Definition & FHIR Mapping
# Side / Role: PATIENT
# Primary API: /v1/notification/subscribe
# Callback API: /v1/notification/on_subscribe
# Carries JWE: false
# Focal Resource: Subscription (JSON)
# NRCeS Profile: none, not a FHIR resource
# ==============================================================================

code: "E1"
title: "Subscribe to notifications"
side: "patient"
api: "/v1/notification/subscribe"
callback: "/v1/notification/on_subscribe"
workflow: "N01, N02, N03, N04"
carries_jwe: false
focal_resource: "Subscription (JSON)"
profiles: {}
description: "Personal health record app subscribes to receive push notifications on claim events for an ABHA ID."
fields:
  - key: "subscriberId"
    label: "Beneficiary ABHA Address"
    group: "Subscription"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JWE payload)"
    fhir_path: "Payload.subscriber.id"
    example_value: "ravi@abdm"
  - key: "topic"
    label: "Subscription Topics"
    group: "Subscription"
    data_type: "string"
    cardinality: "1..*"
    required: true
    fhir_resource: "N/A (JWE payload)"
    fhir_path: "Payload.topic_code[]"
    example_value: "workflow_events"
  - key: "recipientCode"
    label: "Subscribing App Participant Code"
    group: "Subscription"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JWE payload)"
    fhir_path: "Payload.recipient_code"
    example_value: "phr-app-xyz@bsp"
  - key: "endpointUrl"
    label: "Notification Callback URL"
    group: "Subscription"
    data_type: "url"
    cardinality: "1..1"
    required: true
    fhir_resource: "N/A (JWE payload)"
    fhir_path: "Payload.on_notification_url"
    example_value: "https://api.phrapp.com/v1/hcx/notification/on_subscribe"
