# ==============================================================================
# Use Case C2: De-link ABHA from policy - Data Element Definition & FHIR Mapping
# Side / Role: PAYER
# Primary API: /participant/delink/abha/policy
# Callback API: None
# Carries JWE: false
# Focal Resource: Policy Delink Record (JSON)
# NRCeS Profile: none, not a FHIR resource
# ==============================================================================

code: "C2"
title: "De-link ABHA from policy"
side: "payer"
api: "/participant/delink/abha/policy"
callback: null
workflow: "none"
carries_jwe: false
focal_resource: "Policy Delink Record (JSON)"
profiles:
  Patient: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Patient"
  Coverage: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Coverage"
description: "Remove linkage between ABHA ID and policy upon policy cancellation or transfer."
fields:
  - key: "abhaNumber"
    label: "ABHA Number"
    group: "Delink"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Patient"
    fhir_path: "Patient.identifier[type=ABHA].value"
    example_value: "91234567890123"
  - key: "policyNumber"
    label: "Policy Number"
    group: "Delink"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "Coverage"
    fhir_path: "Coverage.identifier[0].value"
    example_value: "POL-HOSP-2026-0045"
