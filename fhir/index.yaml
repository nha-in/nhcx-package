# Catalogue of every sample FHIR bundle in package/fhir/.
#
# One entry per use case directory, in NHA's order (letter, then number):
#
#   title          the use case, from usecases.yaml
#   folder         the directory, from the package root
#   bundle_count   how many bundles it holds
#   files          one entry per bundle:
#
#     file           the file name inside the folder
#     resource_type  always Bundle
#     entries        how many entries the bundle carries
#     label          a short name for the bundle, as a gallery would show it
#     summary        what the bundle is and what to read in it
#     direction      request: it opens an exchange (a submit, check, request or a
#                    payer-initiated notice); response: it answers one (an on_* call)
#     side           who puts it on the wire: provider or payer
#     scheme         generic: any payer on the exchange; pmjay: sent to or by the
#                    PMJAY State Health Agency
#     workflow       the x-hcx-workflow_id it travels with, as a string, or null
#                    where the exchange carries none or the bundle is not a capture
#     focal          the resource the bundle is about
#     leads_with     only where the first entry is not the focal resource: an
#                    eligibility response echoes the request it answers first
#     api            the NHCX endpoint that carries it
#     builder        only for bundles a provider builds: the builder use case, as
#                    <bundle>/<step> from builder_use_cases in usecases.yaml
#     origin         wire: taken from a live sandbox exchange, identifiers of the
#                    beneficiary replaced; example: written to the specification,
#                    placeholders throughout
#     note           only where there is something to know before reading it
#
# A gallery reads each side in two sets. A provider's bundles split by origin:
# the examples, written to the specification in the generic shape any payer
# takes, IRDAI-regulated insurers and TPAs included; and the captures from the
# sandbox run against the PMJAY payer. A payer's split by scheme: the generic
# payer's messages, and the PMJAY State Health Agency's own.
#
# Generated from the bundles and the metadata kept with them; validate the
# bundles with system/validate-bundles.mjs after adding one.
use_cases:
  B1:
    title: Check coverage eligibility
    folder: package/fhir/B1
    bundle_count: 5
    files:
      - file: B1-check.json
        resource_type: Bundle
        entries: 7
        label: Auth-requirements check
        summary: "The eligibility check that opens a case, with purpose auth-requirements: is this package covered for this member at this hospital, and what has to be attached."
        direction: request
        side: provider
        scheme: generic
        workflow: null
        focal: CoverageEligibilityRequest
        api: /v1/coverageeligibility/check
        builder: coverage/auth-requirements
        origin: wire
      - file: auth-requirements.json
        resource_type: Bundle
        entries: 7
        label: Auth-requirements request
        summary: "purpose ['auth-requirements']: is this package covered for this member at this hospital, and what has to be attached. The call worth making before every pre-authorisation."
        direction: request
        side: provider
        scheme: generic
        workflow: null
        focal: CoverageEligibilityRequest
        api: /v1/coverageeligibility/check
        builder: coverage/auth-requirements
        origin: example
      - file: benefits.json
        resource_type: Bundle
        entries: 7
        label: Benefits request
        summary: "purpose ['benefits']: how much cover remains, against which categories."
        direction: request
        side: provider
        scheme: generic
        workflow: null
        focal: CoverageEligibilityRequest
        api: /v1/coverageeligibility/check
        builder: coverage/benefits
        origin: example
      - file: discovery.json
        resource_type: Bundle
        entries: 7
        label: Discovery request
        summary: "purpose ['discovery']: which policy does this beneficiary hold? The fallback when policy lookup has not already answered it."
        direction: request
        side: provider
        scheme: generic
        workflow: null
        focal: CoverageEligibilityRequest
        api: /v1/coverageeligibility/check
        builder: coverage/discovery
        origin: example
      - file: validation.json
        resource_type: Bundle
        entries: 7
        label: Validation request
        summary: "purpose ['validation']: is the policy in force today, and what is left in the wallet."
        direction: request
        side: provider
        scheme: generic
        workflow: null
        focal: CoverageEligibilityRequest
        api: /v1/coverageeligibility/check
        builder: coverage/validation
        origin: example
