# ==============================================================================
# Use Case B7: Acknowledge payment notice - Data Element Definition & FHIR Mapping
# Side / Role: PROVIDER
# Primary API: /v1/paymentnotice/on_request
# Callback API: /v1/paymentnotice/request
# Carries JWE: true
# Focal Resource: PaymentReconciliation / Task
# NRCeS Profile: https://nrces.in/ndhm/fhir/r4/StructureDefinition/PaymentReconciliation
# ==============================================================================

code: "B7"
title: "Acknowledge payment notice"
side: "provider"
api: "/v1/paymentnotice/on_request"
callback: "/v1/paymentnotice/request"
workflow: "17 (or echoes payer notice wf30)"
carries_jwe: true
focal_resource: "PaymentReconciliation / Task"
nrces_profile: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/PaymentReconciliation"
profiles:
  PaymentReconciliation: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/PaymentReconciliation"
  Task: "https://nrces.in/ndhm/fhir/r4/StructureDefinition/Task"
description: "Acknowledge receipt of settlement advice and bank remittance notification."
fields:
  - key: "settlementNumber"
    label: "Payment Reference"
    group: "Settlement"
    data_type: "string"
    cardinality: "1..1"
    required: true
    fhir_resource: "PaymentReconciliation"
    fhir_path: "PaymentReconciliation.identifier[0].value"
    example_value: "SETTLE-2026-001"
  - key: "status"
    label: "Acknowledgment Status"
    group: "Settlement"
    data_type: "code"
    cardinality: "1..1"
    required: true
    fhir_resource: "PaymentReconciliation"
    fhir_path: "PaymentReconciliation.status"
    example_value: "active"
